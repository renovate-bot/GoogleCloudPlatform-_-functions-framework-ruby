name: Ruby Lint CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.repository == 'GoogleCloudPlatform/functions-framework-ruby' }}
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          index.rubygems.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          rubygems.org:443

    - name: Checkout repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install Ruby 3.1
      uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
      with:
        ruby-version: "3.4"
        bundler-cache: true
    - name: Install toys
      run: gem install --no-document toys
    - name: Lint
      run: "toys ci --only --test-rubocop"
